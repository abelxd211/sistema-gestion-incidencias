<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión · Sistema de Gestión de Incidencias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>try{var t=localStorage.getItem('tema');if(t==='oscuro')document.documentElement.classList.add('tema-oscuro');}catch(e){}</script>
</head>
<body class="login-body">
  <div class="login-box">
    <div class="login-brand">
      <span class="brand-mark" style="width:40px;height:40px;font-size:15px;">GI</span>
      <div>
        <h1>Sistema de Gestión<br />de Incidencias</h1>
        <span class="subtitle">Panel de soporte interno</span>
      </div>
    </div>

    <div class="login-cuerpo">
      <form id="form-login">
        <label>
          Correo electrónico
          <input type="email" id="email" required autofocus placeholder="tucorreo@empresa.com" autocomplete="username" />
        </label>

        <label>
          Contraseña
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </label>

        <p id="mensaje-error" class="error-msg"></p>

        <button type="submit" style="width:100%;margin-top:10px;">Entrar al sistema</button>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="toast.js"></script>
  <script src="login.js"></script>
</body>
</html>
