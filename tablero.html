<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tablero · Sistema de Gestión de Incidencias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>try{var t=localStorage.getItem('tema');if(t==='oscuro')document.documentElement.classList.add('tema-oscuro');}catch(e){}</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">GI</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link" title="Incidencias" data-label="Incidencias">🏠</a>
        <a href="tablero.html" class="nav-link active" title="Tablero" data-label="Tablero">📋</a>
        <a href="nueva.html" class="nav-link" title="Registrar incidencia" data-label="Registrar incidencia">＋</a>
        <a href="usuarios.html" class="nav-link link-nav" title="Usuarios" data-label="Usuarios">👥</a>
        <a href="reportes.html" class="nav-link link-nav" title="Reportes" data-label="Reportes">📊</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="user-avatar"></span>
          <span id="usuario-actual"></span>
        </div>
        <button id="btn-logout" type="button" title="Cerrar sesión">⏻</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="page-header">
        <div>
          <h1>Tablero Kanban</h1>
          <p class="subtitle">Arrastra una tarjeta para cambiar su estado</p>
        </div>
      </header>

      <main>
        <section class="panel">
          <h2>Incidencias por estado</h2>
          <p class="subtexto">
            Cada movimiento queda registrado en el historial de la incidencia y notifica
            al responsable asignado. Las tarjetas con el SLA vencido están marcadas en rojo.
          </p>
          <div id="kanban" class="kanban"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="ui.js"></script>
  <script src="toast.js"></script>
  <script src="chrome.js"></script>
  <script src="tablero.js"></script>
</body>
</html>
