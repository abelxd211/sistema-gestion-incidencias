<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tablero Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>try{var t=localStorage.getItem('tema');if(t==='oscuro')document.documentElement.classList.add('tema-oscuro');}catch(e){}</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">GI</span>
        <span class="brand-name">Gestión de<br />Incidencias</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><span>Incidencias</span></a>
        <a href="tablero.html" class="nav-link active"><span>Tablero</span></a>
        <a href="nueva.html" class="nav-link"><span>Registrar incidencia</span></a>
        <a href="usuarios.html" class="nav-link link-nav"><span>Usuarios</span></a>
        <a href="reportes.html" class="nav-link link-nav"><span>Reportes</span></a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="user-avatar"></span>
          <span id="usuario-actual"></span>
        </div>
        <button id="btn-logout" type="button">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="page-header">
        <h1>📋 Tablero Kanban</h1>
      </header>

      <main>
        <section class="panel">
          <h2>Incidencias por estado</h2>
          <p class="subtexto">
            Arrastra una tarjeta a otra columna para cambiar su estado. El movimiento queda
            registrado en el historial de la incidencia.
          </p>
          <div id="kanban" class="kanban"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="ui.js"></script>
  <script src="toast.js"></script>
  <script src="chrome.js"></script>
  <script src="tablero.js"></script>
</body>
</html>
